name: Sincronizar Produtos Allu

on:
  schedule:
    - cron: '0 */6 * * *' # A cada 6 horas
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

permissions:
  contents: write # Necessário para commitar e fazer push dos produtos

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Playwright e dependências do sistema
      run: |
        python -m playwright install chromium
        python -m playwright install-deps chromium

    - name: Executar script de sincronização
      run: python sync_products.py

    - name: Commitar e Push das mudanças
      run: |
        git config --global user.name 'Allu Bot'
        git config --global user.email 'bot@allugator.com'
        git add assets/products.json assets/products.js assets/products/
        git diff --quiet && git diff --staged --quiet || (git commit -m "data: sync products automation [skip ci]" && git push)
